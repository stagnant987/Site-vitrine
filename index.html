<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RecordCam — Enregistrement Vidéo & Audio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
        </svg>
        RecordCam
      </div>
    </div>
  </header>

  <main class="main">

    <!-- Prévisualisation caméra -->
    <div class="preview-wrapper" id="previewWrapper">
      <video id="liveVideo" autoplay playsinline muted></video>
      <div class="preview-overlay" id="previewOverlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <p>Autorisez la caméra pour commencer</p>
      </div>
      <div class="recording-badge" id="recordingBadge">
        <span class="rec-dot"></span> REC
      </div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <!-- Contrôles -->
    <div class="controls">
      <button class="ctrl-btn" id="btnCam" title="Caméra">
        <svg id="iconCamOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <svg id="iconCamOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="display:none">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.5 16.5 7 7H1v10h12l4 4V7l-2 2"/>
          <path d="M16 10.5V7l6 4-4 3"/>
        </svg>
        <span>Caméra</span>
      </button>

      <button class="ctrl-btn" id="btnMic" title="Micro">
        <svg id="iconMicOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <svg id="iconMicOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="display:none">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
          <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span>Micro</span>
      </button>

      <button class="ctrl-btn record-btn" id="btnRecord" title="Enregistrer" disabled>
        <svg id="iconRecord" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
          <circle cx="12" cy="12" r="8"/>
        </svg>
        <svg id="iconStop" viewBox="0 0 24 24" fill="currentColor" width="22" height="22" style="display:none">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
        <span id="btnRecordLabel">Enregistrer</span>
      </button>

      <button class="ctrl-btn" id="btnSwitch" title="Retourner caméra" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        <span>Retourner</span>
      </button>
    </div>

    <!-- Mode enregistrement -->
    <div class="mode-selector">
      <button class="mode-btn active" id="modeVideo" data-mode="video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        Vidéo
      </button>
      <button class="mode-btn" id="modeAudio" data-mode="audio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        </svg>
        Audio seul
      </button>
    </div>

    <!-- Barre de niveau audio -->
    <div class="audio-meter-wrap" id="audioMeterWrap">
      <div class="audio-meter">
        <div class="audio-bar" id="audioBar"></div>
      </div>
      <span class="audio-label">Niveau micro</span>
    </div>

    <!-- Message d'état -->
    <div class="status" id="status">Appuyez sur "Caméra" ou "Micro" pour démarrer</div>

    <!-- Liste des enregistrements -->
    <section class="recordings" id="recordingsSection" style="display:none">
      <h2>Enregistrements</h2>
      <div class="recordings-list" id="recordingsList"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
