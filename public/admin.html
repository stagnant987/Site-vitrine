<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — RecordCam</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Administration
      </div>
      <p class="login-sub">Espace réservé à l'administrateur</p>
      <form id="loginForm">
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login">Se connecter</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard" style="display:none">

    <header class="dash-header">
      <div class="dash-header-inner">
        <div class="dash-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Administration
        </div>
        <div class="dash-actions">
          <button class="btn-refresh" id="btnRefresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
            Actualiser
          </button>
          <button class="btn-logout" id="btnLogout">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="dash-main">
      <div class="dash-stats" id="dashStats">
        <div class="stat-card">
          <span class="stat-num" id="statTotal">0</span>
          <span class="stat-lbl">Vidéos reçues</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statSize">0 Mo</span>
          <span class="stat-lbl">Stockage utilisé</span>
        </div>
      </div>

      <div class="dash-empty" id="dashEmpty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <p>Aucune vidéo reçue pour l'instant</p>
        <span>Les enregistrements des utilisateurs apparaîtront ici</span>
      </div>

      <!-- Grille de vidéos -->
      <div class="videos-grid" id="videosGrid"></div>
    </main>

  </div>

  <script src="admin.js"></script>
</body>
</html>
